name = "journalist-rater-ingest"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Poll the news feeds every 10 minutes.
[triggers]
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "INGEST_KV"
id = "a44d4381af1e4d018c75569217fb1841"

# Free-tier Workers AI is the default extractor.
[ai]
binding = "AI"

# Optional upgrade (set with `npx wrangler secret put ANTHROPIC_API_KEY`):
#   ANTHROPIC_API_KEY — switches extraction to claude-haiku-4-5
