name = "journalist-rater-ingest"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Poll the news feeds every 10 minutes.
[triggers]
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "INGEST_KV"
# Filled in by `npx wrangler kv namespace create INGEST_KV` (see worker/README.md)
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (set with `npx wrangler secret put ANTHROPIC_API_KEY`):
#   ANTHROPIC_API_KEY — used for claim extraction (claude-haiku-4-5)
